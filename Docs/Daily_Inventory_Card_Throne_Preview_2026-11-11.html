<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>今日日运·牌面布局预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202820;color:#29372d;font-family:"Songti SC","Noto Serif CJK SC",serif}.stage{min-height:100vh;display:grid;place-items:center;padding:14px;background:radial-gradient(circle at 50% 20%,#4e594a,#202820 75%)}.bag{width:min(1080px,calc(100vw - 28px));height:740px;background:#e9e1cc url('../Content/UI/Textures/WoodlandPaper.png') center/cover;border:2px solid #927f61;box-shadow:0 24px 70px #101510bb,inset 0 0 0 12px #ece3ce;padding:28px 42px 20px}.head{display:flex;justify-content:space-between;align-items:end}.eyebrow{font:700 12px system-ui;color:#68775c;letter-spacing:3px}.head h1{font-size:29px;margin:4px 0 0}.head small{font:14px system-ui;color:#68715e}.tabs{display:flex;gap:12px;margin:17px 0 16px}.tab{background:#e4dbc4;border:1px solid #ae9b7b;padding:9px 18px;font-size:16px}.active{background:#d7d8bd;border-color:#6c795f}.content{display:grid;grid-template-columns:52% 48%;gap:12px;height:540px}.left,.right{background:#f1e8d5aa;border:1px solid #c1b79e}.left{display:flex;flex-direction:column;padding:8px}.cards{display:flex;gap:8px;flex:1;min-height:0}.card{width:155px;height:418px;background:#eee8d6;border:1px solid #a99b7e;padding:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer}.card.selected{background:#dedfca;outline:2px solid #7f8e70}.card img{width:100px;height:360px;object-fit:fill}.name{font-size:15px;margin-top:7px}.cost{font:12px system-ui;color:#778071}.guide{background:#e2dcc6cc;border:1px solid #b5a688;padding:12px 16px;font-size:14px;line-height:1.5}.right{padding:12px;display:flex;align-items:center;gap:6px}.info{flex:1;min-width:0;font-size:15px;line-height:1.6}.info .label{font:700 11px system-ui;color:#64805d;letter-spacing:1px}.effect{font-size:21px;margin:14px 0}.meta{font-size:14px}.throne{width:146px;min-width:146px;padding:5px;background:#ccc5ad;border:1px solid #a69473;box-shadow:0 0 0 5px #e6dfcc,0 9px 24px #574a3333;cursor:zoom-in}.throne img{display:block;width:136px;height:490px}.flavor h2{font-size:18px;line-height:1.3;margin:0 0 18px}.flavor p{font-size:16px;line-height:1.6;color:#52654e;margin:0}.footer{display:flex;gap:12px;margin-top:14px}.button{background:#e5dcc5;border:1px solid #99886b;padding:9px 17px;font-size:15px}.wrap{position:relative}.badge{font:700 11px system-ui;color:#d9e1d1;background:#355541;padding:7px 10px;position:absolute;right:8px;top:-15px}.zoom{display:none;position:fixed;inset:0;background:#121911ef;z-index:3;align-items:center;justify-content:center}.zoom.open{display:flex}.zoom img{height:min(84vh,685px);width:auto}.zoom button{position:absolute;right:24px;top:20px;background:#e5dcc5;border:1px solid #99886b;padding:10px 20px;font:16px "Songti SC";cursor:pointer}
@media(max-height:800px){.wrap{transform:scale(.9);transform-origin:center center}}
</style>
<div class="stage"><div class="wrap"><div class="badge">布局预览 · 非 UE 实机截图</div><main class="bag"><div class="head"><div><div class="eyebrow">随身物品</div><h1>背包</h1></div><small>B / ESC 关闭</small></div><div class="tabs"><div class="tab">元素小物</div><div class="tab active">今日日运 · 可用3张 · 已抽3/3</div></div>
<div class="content"><div class="left"><div class="cards">
<article class="card selected" data-id="IV" data-name="皇帝" data-art="Major_04_Emperor.png" data-effect="火×2" data-mood="王座上的火光越过扶手，照亮了长廊。"><img src="../Content/UI/Textures/MajorArcana/Major_04_Emperor.png"><div class="name">皇帝</div><div class="cost">IV · 额度 1</div></article>
<article class="card" data-id="XV" data-name="恶魔" data-art="Major_15_Devil.png" data-effect="取逆" data-mood="下一步被影子轻轻拨向反面。"><img src="../Content/UI/Textures/MajorArcana/Major_15_Devil.png"><div class="name">恶魔</div><div class="cost">XV · 额度 1</div></article>
<article class="card" data-id="XVII" data-name="星" data-art="Major_17_Star.png" data-effect="风×2" data-mood="星光落下，已有的风应声涨起。"><img src="../Content/UI/Textures/MajorArcana/Major_17_Star.png"><div class="name">星</div><div class="cost">XVII · 额度 1</div></article>
</div><div class="guide">今晚回小屋合成时，从今日日运中选一张，放进一份委托的配方。每张牌只能使用一次；未使用的牌到明天也会消失。</div></div>
<div class="right"><div class="info"><div class="label">牌的功效</div><div id="effect" class="effect">火×2</div><div class="meta">花 1 点额度<br>占 1 个槽位</div></div><div class="throne" id="hero"><img src="../Content/UI/Textures/MajorArcana/Major_04_Emperor.png"></div><div class="info flavor"><h2 id="title">IV · 皇帝</h2><p id="mood">王座上的火光越过扶手，照亮了长廊。</p></div></div></div>
<div class="footer"><div class="button">合上背包</div><div class="button">翻开魔法书 · 今日日运</div></div></main></div></div>
<div class="zoom" id="zoom"><button id="close">返回背包</button><img id="zoomart" src="../Content/UI/Textures/MajorArcana/Major_04_Emperor.png"></div>
<script>for(const c of document.querySelectorAll('.card'))c.addEventListener('click',()=>{document.querySelector('.card.selected')?.classList.remove('selected');c.classList.add('selected');let art='../Content/UI/Textures/MajorArcana/'+c.dataset.art;document.querySelector('#hero img').src=art;document.querySelector('#zoomart').src=art;document.querySelector('#title').textContent=c.dataset.id+' · '+c.dataset.name;document.querySelector('#effect').textContent=c.dataset.effect;document.querySelector('#mood').textContent=c.dataset.mood});document.querySelector('#hero').onclick=()=>document.querySelector('#zoom').classList.add('open');document.querySelector('#close').onclick=()=>document.querySelector('#zoom').classList.remove('open');document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#zoom').classList.remove('open')});</script>
