<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔法书 · 图鉴版式预览</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#28392f;color:#57452f;font-family:Georgia,'Songti SC',serif;padding:12px}.book{width:min(1160px,100%);height:min(760px,calc(100dvh - 24px));padding:9px 10px 13px;border:3px solid #452e1c;background:#765337;box-shadow:0 18px 44px #0006}.edges{height:100%;padding:3px 3px 6px;background:repeating-linear-gradient(#c6ad83 0 1px,#e4d2b0 1px 3px)}.spread{height:100%;display:flex;gap:0}.page{background:#f4e8d1 url('../Content/UI/Textures/WoodlandPaper.png') center/115% 120% no-repeat;min-width:0;padding:32px 34px 24px;display:flex;flex-direction:column}.left{flex:.43}.right{flex:.57}.spine{width:16px;flex-shrink:0;background:linear-gradient(90deg,#8e724b,#332114 48%,#b99d73)}.scroll{overflow:auto;min-height:0;flex:1;scrollbar-width:thin}h1{font-size:28px;line-height:1.3;margin:0 0 22px}h2{font-size:28px;margin:10px 0 12px}p{font-size:20px;line-height:1.75;margin:0 0 22px}.minor{font-size:17px;line-height:1.65}#reference{white-space:pre-line}.muted{color:#87765b}.tabs,.nav{display:flex;gap:8px;flex-wrap:wrap}button{font:18px Georgia,'Songti SC',serif;color:inherit;border:1px solid #ba9b7077;background:#eaddc477;padding:8px 12px;cursor:pointer;text-align:left}button:hover{background:#e5d9be}button.active{background:#dfe5c8}.index button{display:block;width:100%;margin:6px 0}.tabs{margin:0 0 20px}.icon{width:66px;height:66px;background-image:url('../Content/UI/Textures/ElementEmblems.png');background-size:300% 100%;margin:8px 0 18px}.nav{margin-top:12px}.number{text-align:center;font-size:17px;padding-top:10px}.mobile-notes{display:none}.preview-label{position:fixed;top:3px;left:10px;font:11px sans-serif;color:#dae1d0;opacity:.7;pointer-events:none}@media(max-width:859px){.left,.spine{display:none}.right{flex:1}.page{padding:28px 22px 22px}.mobile-notes{display:block}h1{font-size:26px}}
</style>
<div class="preview-label">图鉴版式预览 · 不是 UE 实机截图</div><main class="book"><div class="edges"><div class="spread"><section class="page left"><div class="scroll"><h1>查阅目录</h1><p class="minor intro"></p><nav class="index"></nav><p class="minor notes" style="margin-top:22px"></p></div></section><div class="spine"></div><section class="page right"><div class="scroll"><h1>元素手札</h1><nav class="tabs"></nav><div class="icon"></div><h2 id="title"></h2><p id="attribute" class="minor muted"></p><p id="description"></p><p id="reference"></p><div class="mobile-notes"><p class="minor intro"></p><p class="minor notes"></p></div></div><nav class="nav"><button onclick="turn(-1)">← 前页</button><button onclick="turn(1)">后页 →</button><button onclick="document.querySelector('.book').hidden=true">合上书 · J / Esc</button></nav><footer class="number"></footer></section></div></div></main>
<script>
let table,element=0,strength=6;const keys=['fire','wind','water'],names=['火','风','水'];
function select(e,s){element=e;strength=s;render()}function turn(d){let i=Math.max(0,Math.min(29,element*10+strength-1+d));select(Math.floor(i/10),i%10+1)}
function render(){document.querySelector('.book').hidden=false;const row=table.entries.find(r=>r.element===keys[element]&&r.strength===strength);document.getElementById('title').textContent=row.title;document.getElementById('attribute').textContent=names[element]+' · 效果档位 '+strength;document.getElementById('description').textContent=row.description;document.getElementById('reference').textContent=row.reference;document.querySelector('.icon').style.backgroundPosition=(element*50)+'% 0';document.querySelector('.number').textContent='— '+(element*10+strength)+' —';let index=document.querySelector('.index');index.replaceChildren();for(const r of table.entries.filter(r=>r.element===keys[element])){const b=document.createElement('button');b.textContent=r.strength+'　'+r.title;b.classList.toggle('active',r.strength===strength);b.onclick=()=>select(element,r.strength);index.append(b)}const tabs=document.querySelector('.tabs');tabs.replaceChildren();names.forEach((n,e)=>{const b=document.createElement('button');b.textContent=n+'之卷';b.classList.toggle('active',element===e);b.onclick=()=>select(e,1);tabs.append(b)});document.querySelectorAll('.intro').forEach(e=>e.textContent=table.introduction);document.querySelectorAll('.notes').forEach(e=>e.textContent=table.notes)}
fetch('../Config/ForestElementCodex.json').then(r=>r.json()).then(data=>{table=data;render()}).catch(()=>document.getElementById('title').textContent='请从工程目录的本地预览服务打开此页');document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')turn(-1);if(e.key==='ArrowRight')turn(1);if(e.key==='Escape')document.querySelector('.book').hidden=true;if(e.key.toLowerCase()==='j')document.querySelector('.book').hidden=!document.querySelector('.book').hidden});
</script></html>
