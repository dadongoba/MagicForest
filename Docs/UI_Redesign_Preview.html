<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>林间手札 · 纸页修订</title><style>
*{box-sizing:border-box}body{margin:0;background:#d5cbb8;color:#57452f;font:16px "Songti SC",serif;padding:32px 24px}main{width:1000px;margin:auto}header.note{font:12px sans-serif;color:#71634e;display:flex;justify-content:space-between;padding:0 30px 20px}.paper{background:url('../Content/UI/Textures/WoodlandPaper.png') center/100% 100% no-repeat;position:relative}.bag{width:940px;height:560px;margin:auto;padding:40px 42px 35px}.title{display:flex;align-items:center;gap:12px;margin-bottom:18px}.title h1{font-size:23px;font-weight:400;margin:0}.title small{font:12px sans-serif;color:#87765b;margin-left:auto}.body{display:grid;grid-template-columns:59% 41%;height:372px}.grid{display:grid;grid-template-columns:repeat(4,110px);grid-auto-rows:120px;gap:8px;align-content:start;margin-right:12px}.tile{font:14px "Songti SC",serif;color:#57452f;background:#f4e8d155;border:1px solid #ba9b7080;border-radius:7px;position:relative;padding:10px 7px;cursor:pointer}.tile:hover{border-color:#77804d}.tile.selected{background:#dfe5c8aa;border-color:#77804d}.tile span{display:block}.emblem{width:48px;height:40px;margin:0 auto 2px;background-image:url(../Content/UI/Textures/ElementEmblems.png);background-size:300% 100%;background-position:0% center}.emblem.wind-icon{background-position:50% center}.emblem.water-icon{background-position:100% center}.stamp{font:13px "Songti SC",serif;width:44px;line-height:20px;margin:0 auto 3px;border-radius:7px;background:#be6c4e20}.wind{background:#7d8c5822}.water{background:#688e9722}.tile .name{font-size:12px;line-height:1.5}.qty{position:absolute;bottom:5px;right:8px;font:10px sans-serif;color:#87765b}.empty{background:#ba9b701a;border-radius:7px}.detail{padding:12px 20px 20px 28px;position:relative}.detail:before{content:'';position:absolute;left:3px;top:0;bottom:18px;width:1px;background:linear-gradient(transparent,#ba9b7055,transparent)}.detail small{font:12px sans-serif;color:#7d8c58}.detail h2{font-size:25px;font-weight:400;margin:27px 0 20px}.detail .attr{font:13px sans-serif;color:#87765b;line-height:2}.detail p{font-size:16px;line-height:1.9;margin:18px 0}.close{display:block;margin:10px 0 0 auto;background:#f4e8d1aa;color:#57452f;border:1px solid #ba9b70;border-radius:5px;padding:9px 28px;font:14px "Songti SC",serif;cursor:pointer}.subtitle{font-size:14px;font-weight:400;margin:26px 30px 8px}.dialog{width:940px;margin:auto;min-height:210px;padding:30px 42px 32px}.dialog h2{font-size:18px;font-weight:400;margin:0 0 10px}.dialog p{font-size:16px;line-height:1.8;margin:0 0 15px;max-width:780px}.input{display:flex;gap:8px;padding-right:25px}.input input{background:#f4e8d188;border:1px solid #ba9b70;border-radius:5px;padding:8px 12px;font:14px "Songti SC",serif;color:#57452f;flex:1}.input button{background:#77804d;color:#fff7e5;border:1px solid #77804d;border-radius:5px;padding:8px 24px;font:14px "Songti SC",serif}.caption{font:11px sans-serif;color:#71634e;line-height:1.8;margin:16px 30px}
</style><main><header class="note"><span>森林手札 · 纸页与背包比例修订</span><span>离线预览 / 非 UE 实机截图</span></header><section class="paper bag"><div class="title"><h1>背包</h1><small>B / ESC 关闭</small></div><div class="body"><div class="grid">
<button class="tile selected" data-name="炉火纽扣" data-attr="火元素 · 5 点" data-desc="黄铜边缘始终温热，中央的小火苗偶尔会探出头，仿佛还在等一件合身的外套。"><span class="emblem"></span><span class="stamp">火5</span><span class="name">炉火纽扣</span><span class="qty">×1</span></button>
<button class="tile" data-name="没有舌头的铜铃" data-attr="风元素 · 3 点" data-desc="铃内空空如也，风经过时，却会响起三声清楚的铃音。"><span class="emblem wind-icon"></span><span class="stamp wind">风3</span><span class="name">没有舌头的铜铃</span><span class="qty">×1</span></button>
<button class="tile" data-name="装着小雨的瓶子" data-attr="水元素 · 6 点" data-desc="软木塞下飘着一片小云，瓶壁上不时滑过一滴刚落下的雨。"><span class="emblem water-icon"></span><span class="stamp water">水6</span><span class="name">装着小雨的瓶子</span><span class="qty">×2</span></button>
<button class="tile" data-name="留住叹息的线轴" data-attr="风元素 · 2 点" data-desc="苍白的细线会自行松开一小截，随后传来一声不知属于谁的叹息。"><span class="emblem wind-icon"></span><span class="stamp wind">风2</span><span class="name">留住叹息的线轴</span><span class="qty">×1</span></button><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div><div class="empty"></div></div><article class="detail"><small>物品记录</small><h2 id="name">炉火纽扣</h2><div class="attr"><span id="attr">火元素 · 5 点</span><br>采集于第 1 天</div><p id="desc">黄铜边缘始终温热，中央的小火苗偶尔会探出头，仿佛还在等一件合身的外套。</p></article></div><button class="close">合上背包</button></section><h2 class="subtitle">交谈面板 · 材质示意</h2><section class="paper dialog"><h2>Natta</h2><p>先别急着把东西全倒进去。你把手头的材料说给我听，我们一起看看，缺的究竟是哪一点。</p><div class="input"><input placeholder="写下想说的话……"><button>发送</button></div></section><p class="caption">纸张图片已接入 Slate，并随工程分发。此页仅用于查看素材与排版方向；字体和几何细节以 UE 实际渲染为准。<br>动态道具暂用元素标记，没有专属插画；此版本尚未达到参考图的完整美术完成度。</p></main><script>document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));t.classList.add('selected');document.querySelector('#name').textContent=t.dataset.name;document.querySelector('#attr').textContent=t.dataset.attr;document.querySelector('#desc').textContent=t.dataset.desc})</script></html>
