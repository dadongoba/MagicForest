<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交付物品后的引路故事</title><style>*{box-sizing:border-box}body{margin:0;background:#4e5646;color:#57452f;font-family:"Songti SC",serif}.anchor{min-height:100dvh;padding:24px;display:flex;align-items:center;justify-content:center}.paper{width:min(1000px,100%);height:min(480px,calc(100dvh - 48px));padding:30px 32px 42px;background:url('../Content/UI/Textures/WoodlandPaper.png') center/100% 100%;display:flex;flex-direction:column}.head{display:flex;gap:14px;align-items:center;flex-shrink:0}.portrait{width:52px;height:60px;border:1px solid #ba9b70;border-radius:20px 20px 4px 4px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}.role{font-size:18px;color:#87765b}.title{font-size:25px;margin-top:5px}.story{font-size:28px;line-height:1.6;overflow:auto;flex:1;min-height:0;margin:14px 0}.foot{font-size:18px;line-height:1.5;color:#87765b;flex-shrink:0}.note{position:absolute;bottom:12px;left:24px;color:#eee7d7;font:12px sans-serif;line-height:1.6;pointer-events:none}@media(max-width:747px){.paper{height:min(600px,calc(100dvh - 48px))}}</style><div class="anchor"><section class="paper"><header class="head"><div class="portrait">头像</div><div><div class="role">小物正在为你带路</div><div class="title">去见 Fawnia</div></div></header><p class="story">你交出没有舌头的铜铃，它从掌心升起，沿小路轻轻摇晃。每当你经过岔口，它便转向一边，响起一声清脆的铃音。直到你看见 Fawnia，铃身才在最后一声轻响中散成细尘。</p><footer class="foot">已交付　没有舌头的铜铃 ×1<br>WASD / Esc　停止跟随</footer></section></div><div class="note">交出物品后的行进故事 · 屏幕居中<br>离线尺寸预览 · 非UE实机 · 头像占位与故事示例</div></html>
